    <title>Sanjeev Umar</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      #root {
        height: 100%;
      }

      .app-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #030014;
        z-index: 9999;
        transition: opacity 0.3s, visibility 0.3s;
      }

      .app-loader.loaded {
        opacity: 0;
        visibility: hidden;
      }

      .rocket-container {
        position: relative;
        width: 160px;
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .rocket {
        position: relative;
        width: 80px;
        height: 128px;
      }

      .rocket-body {
        position: absolute;
        width: 40px;
        height: 96px;
        background-color: rgb(199 210 254);
        border-radius: 8px;
        left: 20px;
        bottom: 0;
      }

      .rocket-top {
        position: absolute;
        width: 0;
        height: 0;
        left: 20px;
        bottom: 96px;
        border-left: 20px solid transparent;
        border-right: 20px solid transparent;
        border-bottom: 16px solid rgb(99 102 241);
      }

      .rocket-window {
        position: absolute;
        width: 22px;
        height: 22px;
        background-color: rgb(96 165 250);
        border-radius: 50%;
        left: 28px;
        bottom: 64px;
        border: 2px solid rgb(37 99 235);
      }

      .rocket-fin-left {
        position: absolute;
        width: 0;
        height: 0;
        left: 4px;
        bottom: 16px;
        border-left: 12px solid transparent;
        border-bottom: 20px solid rgb(99 102 241);
      }

      .rocket-fin-right {
        position: absolute;
        width: 0;
        height: 0;
        right: 4px;
        bottom: 16px;
        border-right: 12px solid transparent;
        border-bottom: 20px solid rgb(99 102 241);
      }

      .rocket-exhaust {
        position: absolute;
        width: 40px;
        display: flex;
        justify-content: center;
        left: 20px;
        bottom: -36px;
      }

      .exhaust-flame {
        width: 8px;
        height: 24px;
        background-color: rgb(192 132 252);
        margin: 0 2px;
        border-bottom-left-radius: 8px;
        border-bottom-right-radius: 8px;
        opacity: 0.75;
        animation: flame-pulse 1s infinite;
      }

      .exhaust-flame:nth-child(2) {
        height: 32px;
        background-color: rgb(168 85 247);
        animation-delay: 0.2s;
      }

      .exhaust-flame:nth-child(3) {
        background-color: rgb(192 132 252);
        animation-delay: 0.4s;
      }

      @keyframes flame-pulse {
        0%,
        100% {
          transform: scaleY(1);
          opacity: 0.75;
        }
        50% {
          transform: scaleY(1.2);
          opacity: 0.9;
        }
      }

      .loading-text {
        margin-top: 16px;
        color: rgb(96 165 250);
        font-size: 18px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        font-weight: 600;
      }
    </style>
    <script type="module" crossorigin src="/sanjeev-portfolio/assets/index-DBExf7OB.js"></script>
    <link rel="stylesheet" crossorigin href="/sanjeev-portfolio/assets/index-D9vT2pvV.css">
  </head>
  <body>
    <div id="root">
      <div id="app-loader" class="app-loader">
        <div class="rocket-container">
          <div class="rocket">
            <div class="rocket-body"></div>
            <div class="rocket-top"></div>
            <div class="rocket-window"></div>
            <div class="rocket-fin-left"></div>
            <div class="rocket-fin-right"></div>
            <div class="rocket-exhaust">
              <div class="exhaust-flame"></div>
              <div class="exhaust-flame"></div>
              <div class="exhaust-flame"></div>
            </div>
          </div>
        </div>
        <div class="loading-text">Preparing to take off...</div>
      </div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const loader = document.getElementById("app-loader");
        const observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            if (mutation.target.children.length > 1) {
              loader.classList.add("loaded");
              setTimeout(function () {
                if (loader.parentNode) {
                  loader.parentNode.removeChild(loader);
                }
              }, 300);
              observer.disconnect();
            }
          });
        });

        observer.observe(document.getElementById("root"), {
          childList: true,
          subtree: true,
        });

        setTimeout(function () {
          if (loader && !loader.classList.contains("loaded")) {
            loader.classList.add("loaded");
            setTimeout(function () {
              if (loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }
            }, 300);
          }
        }, 5000);
      });
    </script>
  </body>
</html>
